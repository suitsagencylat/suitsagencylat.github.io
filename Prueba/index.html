<style>
/* ================================
   SUITS AGENCY BRANDING 3.0
   Naranja como LUZ INDIRECTA
   Inspirado en backlight LED ambiental
================================ */

:root {
    --black: #0a0a0a;
    --black-deep: #050505;
    --white: #ffffff;
    --silver: #a0a0a0;
    --silver-dim: #6a6a6a;
    --accent-blue: #00d4ff;
    --accent-blue-glow: rgba(0, 212, 255, 0.4);
    --accent-orange: #ff6b00;
    --accent-orange-soft: rgba(255, 107, 0, 0.15);
    --accent-orange-glow: rgba(255, 107, 0, 0.35);
    --accent-orange-ambient: rgba(255, 107, 0, 0.08);
    --glass-border: rgba(255, 255, 255, 0.06);
    --glass-border-orange: rgba(255, 107, 0, 0.2);
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    overflow-x: hidden;
}

/* ================================
   EFECTO DE LUZ INDIRECTA NARANJA
   Glow ambiental en secciones
================================ */

.hero-section {
    position: relative;
    padding: 80px 20px 60px;
}

.hero-section::before {
    content: "";
    position: absolute;
    top: -100px;
    right: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, var(--accent-orange-glow) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(60px);
}

.hero-section::after {
    content: "";
    position: absolute;
    bottom: -50px;
    left: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, var(--accent-orange-ambient) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(80px);
}

/* ================================
   HERO BRAND
================================ */

.hero-brand {
    max-width: 850px;
    margin: 0 auto 45px;
    text-align: center;
    position: relative;
    z-index: 2;
}

.hero-brand h1 {
    font-family: var(--font-display);
    font-size: clamp(3rem, 8vw, 5.5rem);
    line-height: 0.95;
    letter-spacing: 2px;
    margin: 0;
    color: var(--white);
}

.hero-brand h1 span {
    color: var(--accent-blue);
    text-shadow:
        0 0 10px rgba(0, 212, 255, 0.5),
        0 0 25px rgba(0, 212, 255, 0.3),
        0 0 50px rgba(0, 212, 255, 0.15);
}

.hero-brand p {
    max-width: 700px;
    margin: 30px auto;
    color: var(--silver);
    font-size: 1.1rem;
    line-height: 1.8;
}

/* ================================
   CARRUSEL DE TIPS
   Con luz indirecta naranja sutil
================================ */

.tips-carousel {
    width: 90%;
    max-width: 700px;
    height: 130px;
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    border: 1px solid var(--glass-border-orange);
    margin: 20px auto 40px;
    background: linear-gradient(
        135deg,
        rgba(255, 107, 0, 0.03) 0%,
        rgba(255, 255, 255, 0.01) 50%,
        rgba(0, 212, 255, 0.03) 100%
    );
    box-shadow:
        0 0 40px rgba(255, 107, 0, 0.08),
        inset 0 0 30px rgba(255, 107, 0, 0.02);
}

.tip-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 0 30px;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
}

.tip-slide.active {
    opacity: 1;
    z-index: 2;
}

.tip-slide i {
    font-size: 2rem;
    color: var(--accent-blue);
    flex-shrink: 0;
    text-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
}

.tip-slide p {
    margin: 0;
    color: var(--silver);
    font-size: 1rem;
    line-height: 1.5;
    text-align: left;
}

.tip-slide strong {
    color: var(--white);
}

@media (max-width: 480px) {
    .tips-carousel { height: 150px; }
    .tip-slide p { font-size: 0.9rem; }
}

/* ================================
   BOTÓN CTA
   Luz indirecta naranja en hover
================================ */

.cta-main {
    display: inline-block;
    padding: 16px 45px;
    border: 1px solid rgba(255, 107, 0, 0.4);
    color: var(--white);
    font-family: var(--font-display);
    font-size: 1.2rem;
    letter-spacing: 4px;
    text-decoration: none;
    border-radius: 12px;
    background: linear-gradient(
        135deg,
        rgba(255, 107, 0, 0.1) 0%,
        rgba(255, 107, 0, 0.05) 100%
    );
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
    margin-top: 20px;
    box-shadow:
        0 0 20px rgba(255, 107, 0, 0.1),
        inset 0 0 20px rgba(255, 107, 0, 0.05);
}

.cta-main::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 107, 0, 0.2),
        transparent
    );
    transition: left 0.6s ease;
}

.cta-main:hover::before {
    left: 100%;
}

.cta-main:hover {
    border-color: rgba(255, 107, 0, 0.7);
    box-shadow:
        0 0 40px rgba(255, 107, 0, 0.25),
        0 0 80px rgba(255, 107, 0, 0.1),
        inset 0 0 30px rgba(255, 107, 0, 0.08);
    transform: translateY(-2px);
    color: var(--white);
}

/* ================================
   TARJETAS NAV
   Backlight naranja indirecto
================================ */

.nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
}

.nav-card {
    background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0.01) 100%
    );
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 35px 30px;
    text-decoration: none;
    color: var(--white);
    transition: all 0.5s ease;
    position: relative;
    overflow: hidden;
}

.nav-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 107, 0, 0.5),
        transparent
    );
    opacity: 0;
    transition: opacity 0.5s ease;
}

.nav-card::after {
    content: "";
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 100px;
    background: radial-gradient(
        ellipse,
        rgba(255, 107, 0, 0.15) 0%,
        transparent 70%
    );
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
}

.nav-card:hover {
    transform: translateY(-8px);
    border-color: rgba(255, 107, 0, 0.25);
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(255, 107, 0, 0.1);
}

.nav-card:hover::before {
    opacity: 1;
}

.nav-card:hover::after {
    opacity: 1;
}

.nav-card i {
    font-size: 2rem;
    color: var(--accent-blue);
    margin-bottom: 18px;
    display: block;
    transition: all 0.4s ease;
    text-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
}

.nav-card:hover i {
    color: var(--accent-orange);
    text-shadow: 0 0 20px rgba(255, 107, 0, 0.4);
}

.nav-card h3 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    letter-spacing: 3px;
    margin: 0 0 12px;
    color: var(--white);
}

.nav-card p {
    color: var(--silver);
    font-size: 0.92rem;
    line-height: 1.7;
    margin: 0;
}

/* ================================
   WHY SUITS
   Luz indirecta naranja desde abajo
================================ */

.why-suits {
    position: relative;
    padding: 80px 20px;
    max-width: 1200px;
    margin: 0 auto;
}

.why-suits::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 200px;
    background: radial-gradient(
        ellipse at bottom,
        rgba(255, 107, 0, 0.08) 0%,
        transparent 70%
    );
    pointer-events: none;
    z-index: 0;
}

.why-suits h2 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    letter-spacing: 5px;
    color: var(--white);
    text-align: center;
    margin: 0 auto 50px;
    position: relative;
    z-index: 2;
    text-shadow: 0 0 30px rgba(255, 107, 0, 0.15);
}

/* ================================
   PRESENCIA LATINOAMERICANA
   Glow ambiental naranja en grid
================================ */

.countries-section {
    position: relative;
    padding: 80px 20px;
    max-width: 1200px;
    margin: 0 auto;
}

.countries-section::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 300px;
    background: radial-gradient(
        ellipse,
        rgba(255, 107, 0, 0.06) 0%,
        transparent 70%
    );
    pointer-events: none;
    z-index: 0;
    filter: blur(40px);
}

.countries-section h2 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    letter-spacing: 5px;
    color: var(--white);
    text-align: center;
    margin-bottom: 15px;
    position: relative;
    z-index: 2;
    text-shadow: 0 0 30px rgba(255, 107, 0, 0.15);
}

.countries-section > p {
    text-align: center;
    color: var(--silver);
    margin-bottom: 40px;
    position: relative;
    z-index: 2;
}

.countries-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
}

.country-item {
    background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0.005) 100%
    );
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 18px 15px;
    text-align: center;
    color: var(--white);
    font-size: 0.95rem;
    transition: all 0.4s ease;
    cursor: default;
    position: relative;
    overflow: hidden;
}

.country-item::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--accent-orange),
        transparent
    );
    opacity: 0;
    transition: opacity 0.4s ease;
}

.country-item:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 107, 0, 0.3);
    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4),
        0 0 25px rgba(255, 107, 0, 0.1);
}

.country-item:hover::before {
    opacity: 0.6;
}

/* ================================
   SOCIAL SECTION
   Luz indirecta sutil
================================ */

.social-section {
    text-align: center;
    padding: 80px 20px;
    position: relative;
}

.social-section::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 150px;
    background: radial-gradient(
        ellipse at top,
        rgba(255, 107, 0, 0.06) 0%,
        transparent 70%
    );
    pointer-events: none;
}

.social-section h4 {
    font-family: var(--font-display);
    font-size: 1.8rem;
    letter-spacing: 5px;
    color: var(--white);
    margin-bottom: 30px;
    position: relative;
    z-index: 2;
    text-shadow: 0 0 20px rgba(255, 107, 0, 0.1);
}

.social-icons {
    display: flex;
    justify-content: center;
    gap: 25px;
    position: relative;
    z-index: 2;
}

.social-link {
    width: 55px;
    height: 55px;
    border: 1px solid var(--glass-border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--silver);
    font-size: 1.4rem;
    transition: all 0.4s ease;
    text-decoration: none;
    background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0.01) 100%
    );
    position: relative;
}

.social-link::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255, 107, 0, 0.2) 0%,
        transparent 70%
    );
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: -1;
}

.social-link:hover {
    color: var(--accent-blue);
    border-color: rgba(0, 212, 255, 0.3);
    transform: translateY(-5px);
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
}

.social-link:hover::before {
    opacity: 1;
}

/* ================================
   FOOTER
================================ */

footer {
    text-align: center;
    padding: 40px 20px;
    color: var(--silver-dim);
    font-size: 0.85rem;
    border-top: 1px solid rgba(255, 107, 0, 0.08);
    position: relative;
}

footer::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 107, 0, 0.4),
        transparent
    );
}

/* ================================
   NEWS TICKER
   Luz naranja sutil en el borde
================================ */

.news-ticker {
    background: linear-gradient(
        180deg,
        rgba(255, 107, 0, 0.03) 0%,
        transparent 100%
    );
    border-bottom: 1px solid rgba(255, 107, 0, 0.08);
    overflow: hidden;
    white-space: nowrap;
    position: relative;
}

.news-ticker::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 100px;
    background: linear-gradient(
        90deg,
        var(--black) 0%,
        transparent 100%
    );
    z-index: 2;
}

.news-ticker::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 100px;
    background: linear-gradient(
        270deg,
        var(--black) 0%,
        transparent 100%
    );
    z-index: 2;
}

.ticker-content {
    display: inline-block;
    animation: ticker 25s linear infinite;
    padding: 14px 0;
}

.ticker-content span {
    color: var(--silver-dim);
    font-size: 0.85rem;
    margin-right: 80px;
    letter-spacing: 1px;
}

@keyframes ticker {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
}

/* ================================
   HEADER
================================ */

.main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid rgba(255, 107, 0, 0.06);
    background: linear-gradient(
        180deg,
        rgba(10, 10, 10, 0.98) 0%,
        rgba(10, 10, 10, 0.9) 100%
    );
    backdrop-filter: blur(20px);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-logo {
    display: flex;
    align-items: center;
    gap: 15px;
    text-decoration: none;
}

.header-logo img {
    height: 45px;
}

.logo-text-group h1 {
    font-family: var(--font-display);
    font-size: 1.6rem;
    color: var(--white);
    margin: 0;
    letter-spacing: 2px;
}

.logo-text-group .leyenda {
    font-size: 0.7rem;
    color: var(--silver-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* ================================
   NAVEGACIÓN
================================ */

.header-nav {
    display: flex;
    gap: 8px;
}

.nav-link {
    color: var(--silver);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.88rem;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
}

.nav-link::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--accent-orange),
        transparent
    );
    transition: width 0.3s ease;
}

.nav-link:hover,
.nav-link.active {
    color: var(--white);
    background: rgba(255, 107, 0, 0.05);
}

.nav-link:hover::after,
.nav-link.active::after {
    width: 60%;
}

.nav-link i {
    font-size: 0.85rem;
    color: var(--accent-blue);
}

/* ================================
   MENU MÓVIL
================================ */

.menu-toggle {
    display: none;
    color: var(--white);
    font-size: 1.5rem;
    cursor: pointer;
    z-index: 110;
}

.overlay-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(5px);
    z-index: 90;
}

.overlay-bg.active {
    display: block;
}

/* ================================
   RESPONSIVE
================================ */

@media (max-width: 768px) {
    .menu-toggle { display: block; }
    
    .header-nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 75%;
        max-width: 320px;
        height: 100vh;
        background: linear-gradient(
            180deg,
            var(--black) 0%,
            var(--black-deep) 100%
        );
        flex-direction: column;
        padding: 100px 30px;
        border-left: 1px solid rgba(255, 107, 0, 0.1);
        transition: right 0.4s ease;
        z-index: 95;
        box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
    }
    
    .header-nav.active {
        right: 0;
    }
    
    .nav-link {
        padding: 15px;
        font-size: 1rem;
    }
    
    .main-header {
        padding: 15px 20px;
    }
    
    .countries-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .hero-section::before,
    .hero-section::after {
        width: 300px;
        height: 300px;
    }
}

/* ================================
   SECCIONES GENERALES
================================ */

section {
    position: relative;
}

/* Separadores sutiles con luz naranja */
section:not(.hero-section)::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 30%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 107, 0, 0.15),
        transparent
    );
}
</style>

</head>
