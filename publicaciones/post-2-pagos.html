<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Placa 2 — Los pagos son en dólares</title>
<link rel="stylesheet" href="fuentes.css">
<link rel="stylesheet" href="posts.css">
</head>
<body>

<!-- Sin cifras a proposito: lo que gana cada emisor varia demasiado y un
     numero suelto en el feed se lee como promesa de ingresos. La tabla
     completa vive en /pagos/, que es a donde manda el pie.

     Lo unico numerico que queda es la regla de horas, que no promete
     plata: ordena expectativas. -->
<div class="placa">

    <div class="cuerpo">

        <p class="sobretitulo">Cómo se cobra</p>

        <h1 class="titulo">Los pagos<br><span class="neon">son en dólares</span></h1>

        <p class="parrafo">
            Cuánto depende de las horas que transmitas y del nivel que
            alcances. Hay quien empieza con poco y hay quien cobra miles.
        </p>

        <div class="regla">
            <strong>44 horas al mes = pago completo</strong>
            <span>Entre 20 y 43 horas se cobra la mitad</span>
        </div>

    </div>

    <div class="pie">
        <span class="marca">Tabla completa</span>
        <span class="web">suitsagency.lat/pagos</span>
    </div>

</div>

</body>
</html>
