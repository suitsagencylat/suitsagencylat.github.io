<!-- Las cifras salen de la tabla de /pagos/ (columna total = monedero +

    <div class="cuerpo">

        <p class="sobretitulo">Tabla oficial Bigo Live LATAM</p>

        <h1 class="titulo">¿Cuánto<br><span class="neon">se gana?</span></h1>

        <table class="tabla">
            <thead>
                <tr><th>Semillas</th><th>Total al mes</th></tr>
            </thead>
            <tbody>
                <tr><td>2.000</td><td class="monto">USD 24</td></tr>
                <tr><td>10.000</td><td class="monto">USD 122</td></tr>

                <tr><td>60.000</td><td class="monto">USD 708</td></tr>

        <div class="regla">
            <strong>44 horas al mes = pago completo</strong>

        </div>

    </div>

    <div class="pie">
        <span class="marca">Calcula el tuyo</span>

    </div>
