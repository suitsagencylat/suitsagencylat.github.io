<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academia | Suits Agency</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --accent-blue: #00d4ff;
            --glass-border: rgba(255, 255, 255, 0.12);
            --silver: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
        }

        /* LOGO DE FONDO */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('../logo.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 110%;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        .container { width: 90%; max-width: 450px; margin: 0 auto; padding: 20px 0; }

        .back-btn {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        header h1 {
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* REPRODUCTOR PRINCIPAL */
        .video-box {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video { width: 100%; display: block; }

        .video-info {
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid var(--glass-border);
        }

        #video-title { margin: 0; font-size: 1rem; color: var(--accent-blue); }

        /* LISTA DE VIDEOS */
        .video-list { display: flex; flex-direction: column; gap: 10px; }

        .video-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .video-item:active { transform: scale(0.97); background: rgba(0, 212, 255, 0.1); }

        .video-item i { color: var(--accent-blue); font-size: 1.2rem; }
        .video-item span { font-size: 0.9rem; font-weight: 500; }

        footer { text-align: center; padding: 40px; color: rgba(255,255,255,0.2); font-size: 0.7rem; }
    </style>
</head>
<body>

    <div class="container">
        <a href="../" class="back-btn"><i class="fas fa-chevron-left"></i> VOLVER AL INICIO</a>
        
        <header>
            <h1>Academia Suits</h1>
        </header>

        <div class="video-box">
            <video id="main-video" controls>
                <source src="Cómo paga Bigo Live.mp4" type="video/mp4">
            </video>
            <div class="video-info">
                <h3 id="video-title">Selecciona un tutorial</h3>
            </div>
        </div>

        <div class="video-list">
            <div class="video-item" onclick="changeVideo('Cómo paga Bigo Live.mp4', 'Cómo paga Bigo Live')">
                <i class="fas fa-play-circle"></i>
                <span>Cómo paga Bigo Live</span>
            </div>

            <div class="video-item" onclick="changeVideo('Cómo revisar el Live Data.mp4', 'Cómo revisar el Live Data')">
                <i class="fas fa-chart-bar"></i>
                <span>Cómo revisar el Live Data</span>
            </div>

            <div class="video-item" onclick="changeVideo('Explicación tabla de remuneración.mp4', 'Explicación tabla de remuneración')">
                <i class="fas fa-table"></i>
                <span>Tabla de remuneración</span>
            </div>

            <div class="video-item" onclick="changeVideo('Primera trasmisión.mp4', 'Primera trasmisión')">
                <i class="fas fa-video"></i>
                <span>Primera trasmisión</span>
            </div>
        </div>

        <footer>
            © 2026 SUITS AGENCY
        </footer>
    </div>

    <script>
        function changeVideo(file, title) {
            const video = document.getElementById('main-video');
            const titleElement = document.getElementById('video-title');
            
            video.src = file;
            titleElement.innerText = title;
            video.play();
        }
    </script>

</body>
</html>
