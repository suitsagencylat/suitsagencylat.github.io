<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academia | Suits Agency</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --accent-blue: #00d4ff;
            --glass-border: rgba(255, 255, 255, 0.12);
            --silver: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LOGO DE FONDO */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('../logo.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 110%;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        .container { width: 92%; max-width: 450px; margin: 0 auto; padding: 20px 0; }

        .back-btn {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center; gap: 8px;
        }

        header h1 {
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* REPRODUCTOR ADAPTABLE */
        #video-wrapper {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        /* Proporción Vertical (9:16) */
        .ratio-vertical { aspect-ratio: 9 / 16; max-width: 300px; }
        
        /* Proporción Horizontal (16:9) */
        .ratio-horizontal { aspect-ratio: 16 / 9; }

        iframe { width: 100%; height: 100%; border: none; background: #000; }

        .video-info {
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid var(--glass-border);
            text-align: center;
        }

        #video-title { margin: 0; font-size: 1rem; color: var(--accent-blue); font-weight: 600; }

        /* LISTA DE VIDEOS */
        .video-list { display: flex; flex-direction: column; gap: 12px; }

        .video-item {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .video-item:active { transform: scale(0.96); background: rgba(0, 212, 255, 0.1); border-color: var(--accent-blue); }

        .video-item i { color: var(--accent-blue); font-size: 1.2rem; width: 25px; text-align: center; }
        .video-item div span { display: block; font-size: 0.95rem; font-weight: 500; }
        .video-item div small { color: var(--silver); font-size: 0.75rem; opacity: 0.6; }

        footer { text-align: center; padding: 40px; color: rgba(255,255,255,0.2); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="../" class="back-btn"><i class="fas fa-chevron-left"></i> VOLVER AL INICIO</a>
        
        <header>
            <h1>Academia Suits</h1>
        </header>

        <div id="video-wrapper" class="ratio-vertical">
            <iframe id="main-video" 
                    src="https://www.youtube.com/embed/n-v2Q1TztQA?rel=0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
            <div class="video-info">
                <h3 id="video-title">Cómo revisar el Live Data</h3>
            </div>
        </div>

        <div class="video-list">
            
            <div class="video-item" onclick="changeVideo('n-v2Q1TztQA', 'Cómo revisar el Live Data', 'v', true)">
                <i class="fas fa-chart-line"></i>
                <div>
                    <span>Cómo revisar el Live Data</span>
                    <small>YouTube Shorts - Vertical</small>
                </div>
            </div>

            <div class="video-item" onclick="changeVideo('5qklulnr12c', 'Cómo Paga Bigo Live', 'v', true)">
    <i class="fas fa-play-circle"></i>
    <div>
        <span>Cómo Paga Bigo Live</span>
        
    </div>
</div>


            <div class="video-item" onclick="changeVideo('I6VhuzfdhXg', 'Explicación de la tabla de pagos', 'h', true)">
    <i class="fas fa-play-circle"></i>
    <div>
        <span>Explicación de la Tabla de pagos</span>
        <small>YouTube - Horizontal</small>
    </div>
</div>


            <div class="video-item" onclick="changeVideo('eyOC7ZL6vRc', 'Tu primera trasmisión', 'v', true)">
                <i class="fas fa-video"></i>
                <div>
                    <span>Primera trasmisión</span>
                    <small>Ver Video tutorial</small>
                </div>
            </div>
        </div>

        <footer>
            &copy; 2026 SUITS AGENCY | AGENCIA OFICIAL
        </footer>
    </div>

    <script>
        function changeVideo(source, title, orientation, isYouTube) {
            const wrapper = document.getElementById('video-wrapper');
            const titleElement = document.getElementById('video-title');
            
            // Ajustar el tamaño del reproductor
            if(orientation === 'v') {
                wrapper.className = 'ratio-vertical';
            } else {
                wrapper.className = 'ratio-horizontal';
            }

            titleElement.innerText = title;

            if (isYouTube) {
                // Reemplazar el contenido por un iframe para YouTube
                wrapper.innerHTML = `
                    <iframe id="main-video" 
                            src="https://www.youtube.com/embed/${source}?autoplay=1&rel=0" 
                            allow="autoplay; encrypted-media" 
                            allowfullscreen>
                    </iframe>
                    <div class="video-info"><h3 id="video-title">${title}</h3></div>`;
            } else {
                // Reemplazar el contenido por un reproductor de video local
                wrapper.innerHTML = `
                    <video id="main-video" controls autoplay>
                        <source src="${source}" type="video/mp4">
                    </video>
                    <div class="video-info"><h3 id="video-title">${title}</h3></div>`;
            }
        }
    </script>

</body>
</html>
