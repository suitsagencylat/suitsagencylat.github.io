<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suits Agency | Potencia tu Streaming</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ffffff;
            --bg: #000000;
            --accent: #111111;
            --text-gray: #b3b3b3;
            --purple-neon: #8a2be2;
            --purple-glow: rgba(138, 43, 226, 0.4);
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Section - Ajustada al máximo superior */
        .hero {
            height: auto;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1598550874175-4d0fe427c706?auto=format&fit=crop&q=80'); 
            background-size: cover;
            padding-top: 0; /* Sin espacio arriba */
        }

        .agency-logo {
            width: 550px; 
            max-width: 95%; 
            height: auto;
            margin-top: -40px; /* Logo subido agresivamente */
            margin-bottom: 0px;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-gray);
            max-width: 750px;
            margin-top: 10px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 8px rgba(0,0,0,1);
        }

        .btn-cta {
            background-color: var(--primary);
            color: #000;
            padding: 18px 45px;
            text-decoration: none;
            font-weight: 800;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Sección Bigo: Texto blanco y pegada arriba */
        .bigo-clean-section {
            padding: 10px 0 30px 0; /* Casi sin espacio arriba */
            text-align: center;
            background: transparent;
        }

        .bigo-clean-section p {
            font-size: 0.85rem;
            color: #ffffff; /* Blanco para máxima visibilidad */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        /* Carrusel: Deslizable con el dedo */
        .slider {
            background: var(--bg);
            padding: 40px 0;
            overflow-x: auto;
            display: flex;
            scrollbar-width: none;
            touch-action: pan-x; /* Optimizado para deslizar con el dedo */
        }

        .slider::-webkit-scrollbar { display: none; }

        .slider-track {
            display: flex;
            padding-left: 20px;
            animation: scroll 30s linear infinite;
        }

        .slider:active .slider-track,
        .slider-track.paused {
            animation-play-state: paused;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-300px * 3)); }
        }

        .card {
            width: 260px;
            margin-right: 20px;
            background: var(--accent);
            padding: 35px 25px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--purple-neon);
            box-shadow: 0 0 15px var(--purple-glow);
            flex-shrink: 0;
            user-select: none;
        }

        .faq-section { padding: 40px 20px; max-width: 800px; margin: auto; }
        details { background: #080808; margin-bottom: 12px; padding: 15px; border-radius: 8px; border: 1px solid var(--purple-neon); cursor: pointer; }
        summary { font-weight: 600; display: flex; justify-content: space-between; align-items: center; list-style: none; }
        summary::after { content: '+'; color: var(--purple-neon); }
        footer { padding: 30px; text-align: center; font-size: 0.7rem; color: #333; }

    </style>
</head>
<body>

        <img src="logo.png" alt="Suits Agency Logo" class="agency-logo">
