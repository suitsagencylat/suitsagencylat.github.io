<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suits Agency | Bigo Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505; /* Negro más profundo */
            --card-bg: rgba(20, 25, 35, 0.7); /* Azul muy oscuro traslúcido */
            --accent-blue: #00d4ff; /* El cian del brillo de tu logo */
            --silver: #c0c0c0; /* El plateado de las letras AS */
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Marca de agua con tu logo */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('logo.png'); /* Asegúrate que se llame así en el repo */
            background-repeat: no-repeat;
            background-position: center;
            background-size: 60%; 
            opacity: 0.15; /* Subí un poco la opacidad para que se note el azul */
            z-index: -1;
            filter: brightness(1.2); /* Resalta los brillos azules */
        }

        header {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 212, 255, 0.05) 0%, transparent 70%);
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 0;
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.3));
        }

        .hero-subtitle {
            color: var(--silver);
            font-size: 1.1rem;
            max-width: 500px;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .cta-main {
            margin-top: 40px;
            border: 2px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 12px 35px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            background: transparent;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .cta-main:hover {
            background: var(--accent-blue);
            color: black;
            box-shadow: 0 0 30px var(--accent-blue);
        }

        /* Estilo de las tarjetas con el azul del logo */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 0 10% 100px;
        }

        .nav-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-card:hover {
            border-left: 3px solid var(--accent-blue);
            background: rgba(30, 40, 60, 0.9);
            transform: translateX(10px);
        }

        .nav-card i {
            font-size: 2rem;
            color: var(--accent-blue);
            margin-bottom: 15px;
        }

        .nav-card h3 { margin: 0; font-size: 1.3rem; color: var(--silver); }
        .nav-card p { color: #888; font-size: 0.9rem; }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #222;
            color: #444;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Suits Agency Logo" style="width: 150px; margin-bottom: 20px;">
        <h1>SUITS AGENCY</h1>
        <p class="hero-subtitle">Maximiza tus ingresos en Bigo Live</p>
        <a href="registro.html" class="cta-main">ÚNETE AHORA</a>
    </header>

    <section class="nav-grid">
        <a href="pagos.html" class="nav-card">
            <i class="fas fa-chart-line"></i>
            <h3>TABLA DE METAS</h3>
            <p>Estructura de pagos y bonos mensuales.</p>
        </a>

        <a href="academia.html" class="nav-card">
            <i class="fas fa-lightbulb"></i>
            <h3>CONSEJOS TOP</h3>
            <p>Guía para subir de nivel rápidamente.</p>
        </a>

        <a href="https://wa.me/TU_NUMERO" class="nav-card">
            <i class="fab fa-whatsapp"></i>
            <h3>SOPORTE 24/7</h3>
            <p>Contacto directo con el equipo técnico.</p>
        </a>
    </section>

    <footer>
        &copy; 2026 Suits Agency | Los resultados dependen de tu talento y constancia.
    </footer>

</body>
</html>
