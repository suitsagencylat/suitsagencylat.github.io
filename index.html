<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suits Agency | Bigo Live Official</title>

    <meta name="description" content="Suits Agency: Agencia Oficial de Bigo Live. Reclutamiento de streamers en 24 países. Únete y gana dinero transmitiendo.">
    <meta name="author" content="Suits Agency">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #050505; 
            --accent-blue: #00d4ff; 
            --silver: #e0e0e0; 
            --card-bg: rgba(255, 255, 255, 0.02); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-signature: 'Tangerine', cursive;
            --font-clean: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: var(--font-clean);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('logo.png'); 
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 85%; 
            opacity: 0.2; 
            z-index: -1;
        }

        header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px 10px;
            position: relative;
            z-index: 1;
        }

        /* ESTILO TANGERINE PARA EL NOMBRE */
        h1.agency-name {
            font-family: var(--font-signature);
            font-size: 6.5rem; /* Tangerine necesita ser grande para lucir */
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 0.8;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
        }

        .official-titles {
            margin-top: 15px;
        }

        .hero-subtitle {
            color: var(--silver);
            font-size: 1rem;
            letter-spacing: 3px;
            margin: 5px 0;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .bigo-status {
            color: var(--accent-blue);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* CARRUSEL VERTICAL ADAPTADO */
        .slider-container {
            width: 75%; 
            max-width: 260px;
            aspect-ratio: 9 / 16; 
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            margin: 30px auto;
            background: transparent;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.15);
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            z-index: 1;
        }

        .slide.active { opacity: 1; z-index: 2; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 10% 40px;
            z-index: 1;
        }

        .nav-card {
            background: var(--card-bg);
            padding: 40px 25px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            border: 1px solid var(--glass-border);
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }

        .nav-card:hover { transform: translateY(-10px); border-color: var(--accent-blue); }
        .nav-card i { font-size: 2.2rem; color: var(--accent-blue); margin-bottom: 15px; }
        .nav-card h3 { margin: 10px 0; font-size: 1.4rem; color: var(--silver); }
        .nav-card p { color: #cccccc; font-size: 0.9rem; }

        .cta-main {
            margin-top: 10px;
            display: inline-block;
            padding: 14px 40px;
            border: 2px solid var(--accent-blue);
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .cta-main:hover { background: var(--accent-blue); color: #000; box-shadow: 0 0 20px var(--accent-blue); }

        .countries-section { padding: 40px 10%; text-align: center; }
        .countries-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .country-item { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; }

        footer { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); font-size: 0.75rem; }

        @media (max-width: 768px) {
            h1.agency-name { font-size: 4.5rem; }
            .hero-subtitle { font-size: 0.85rem; }
            .slider-container { width: 70%; max-width: 240px; }
        }
    </style>
</head>
<body>

        </div>

        <a href="registro/" class="cta-main">Postular ahora</a>
    </header>

    <section class="nav-grid">

            <h3>Tabla de Metas</h3>

        </a>
        <a href="academia/" class="nav-card">
            <i class="fas fa-rocket"></i>
            <h3>Academia</h3>
            <p>Guías paso a paso para dominar Bigo Live.</p>
        </a>
        <a href="https://wa.me/595982678695" target="_blank" class="nav-card">
            <i class="fab fa-whatsapp"></i>
            <h3>Soporte Manager</h3>
            <p>Atención directa para dudas o pagos.</p>
        </a>
    </section>

            <div class="country-item">🇲🇽 MX</div><div class="country-item">🇵
