<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suits Agency | Bigo Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CONFIGURACIÓN DE COLORES BASADA EN TU LOGO */
        :root {
            --bg-color: #050505; 
            --accent-blue: #00d4ff; /* Cian del brillo */
            --silver: #e0e0e0; /* Plateado de las letras AS */
            --card-bg: rgba(255, 255, 255, 0.02); /* Casi invisible para ver el logo */
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LOGO DE FONDO (MARCA DE AGUA) */
        body::before {
            content: "";
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-image: url('logo.png'); 
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 85%; /* Tamaño grande */
            opacity: 0.4; /* Visibilidad clara del logo */
            z-index: -1;
            filter: brightness(1.1);
        }

        header {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.4));
        }

        .hero-subtitle {
            color: var(--silver);
            font-size: 1rem;
            letter-spacing: 3px;
            margin-top: 10px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* CONTENEDOR DE TARJETAS TRASLÚCIDAS */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 10% 80px;
            position: relative;
            z-index: 1;
        }

        .nav-card {
            background: var(--card-bg); /* Transparencia total */
            padding: 45px 30px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            border: 1px solid var(--glass-border);
            text-align: center;
            backdrop-filter: blur(8px); /* Efecto cristal para legibilidad */
