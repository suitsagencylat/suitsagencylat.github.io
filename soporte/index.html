<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte | Suits Agency - Bigo Live Official</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #050505;
            --accent-blue: #00d4ff;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --header-bg: rgba(5, 5, 5, 0.9); /* Fondo casi opaco para el header fijo */
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0; /* Eliminamos el padding del body */
            padding-top: 80px; /* Espacio para que el header fijo no tape el contenido */
        }

        /* --- ESTILO DEL ENCABEZADO FIJO (STICKY HEADER) --- */
        header.main-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: var(--header-bg);
            backdrop-filter: blur(10px); /* Efecto borroso elegante */
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%; /* Padding lateral flexible */
            box-sizing: border-box;
            z-index: 1000; /* Asegurar que esté por encima de todo */
        }

        /* LADO IZQUIERDO: NOMBRE DE LA AGENCIA (LOGO) */
        .header-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
        }

        .header-logo h1 {
            font-family: 'Tangerine', cursive;
            font-size: 3rem; /* Tamaño ajustado para el header */
            margin: 0;
            line-height: 1;
        }

        /* LADO DERECHO: MENÚ DE NAVEGACIÓN */
        .header-nav {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: #aaa;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-blue);
        }

        .nav-link i {
            font-size: 1rem;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .container { max-width: 650px; margin: 0 auto; padding: 40px 20px 60px; }

        .main-title {
            text-align: center;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: white;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            margin-bottom: 50px;
            opacity: 0.8;
        }

        /* --- ESTILO FAQ --- */
        .faq-section h2 { font-size: 1.2rem; border-left: 3px solid var(--accent-blue); padding-left: 15px; margin-bottom: 25px; letter-spacing: 1px; }

        .faq-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: 0.3s;
        }

        .faq-question {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .faq-answer {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .faq-item.active { border-color: var(--accent-blue); background: rgba(0, 212, 255, 0.02); }
        .faq-item.active .faq-answer { padding: 5px 20px 20px; max-height: 400px; /* Aumentado por si acaso */ }
        .faq-item.active i { transform: rotate(180deg); color: var(--accent-blue); }

        /* --- LINKS --- */
        .links-section { margin-top: 50px; }
        .links-section h2 { font-size: 1.2rem; border-left: 3px solid var(--accent-blue); padding-left: 15px; margin-bottom: 20px; }

        .interest-link {
            display: flex;
            align-items: center;
            background: var(--glass);
            padding: 18px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            margin-bottom: 12px;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }

        .interest-link:hover { border-color: var(--accent-blue); transform: translateX(8px); background: rgba(255,255,255,0.05); }
        .interest-link i { margin-right: 15px; color: var(--accent-blue); font-size: 1.3rem; }
        .link-text span { display: block; font-size: 0.75rem; color: #666; margin-top: 3px; }

        footer { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); font-size: 0.75rem; position: relative; z-index: 1; border-top: 1px solid var(--glass-border); }

        /* --- AJUSTES RESPONSIVE PARA MÓVIL --- */
        @media (max-width: 600px) {
            header.main-header { padding: 0 3%; height: 60px; }
            .header-logo h1 { font-size: 2.5rem; }
            .header-nav { gap: 10px; }
            .nav-link { font-size: 0.7rem; gap: 4px; letter-spacing: 0.5px; }
            .nav-link i { font-size: 0.9rem; }
            body { padding-top: 70px; }
            .main-title { font-size: 1.5rem; }
            .container { padding: 30px 15px 50px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="../" class="header-logo">
            <h1>Suits Agency</h1>
        </a>
        
        <nav class="header-nav">
            <a href="../" class="nav-link"><i class="fa-solid fa-house"></i>Inicio</a>
            <a href="../pagos/" class="nav-link"><i class="fa-solid fa-gem"></i>Pagos</a>
            <a href="#" class="nav-link active"><i class="fa-solid fa-headset"></i>Soporte</a>
