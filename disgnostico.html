<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico de medición | Suits Agency</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root { --ok:#28d17c; --bad:#ff4d5e; --wait:#ffb020; --cy:#00e8ff; }
* { box-sizing: border-box; }
body {
    margin: 0; padding: 20px 16px 60px;
    background: #050505; color: #fff;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
h1 { font-size: 1.15rem; margin: 0 0 4px; letter-spacing: .5px; }
.sub { color: #888; font-size: .8rem; margin: 0 0 22px; }
.row {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.09);
}
.dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: #555; }
.dot.ok { background: var(--ok); box-shadow: 0 0 9px var(--ok); }
.dot.bad { background: var(--bad); box-shadow: 0 0 9px var(--bad); }
.dot.wait { background: var(--wait); }
.txt { flex: 1; min-width: 0; }
.txt b { display: block; font-weight: 600; font-size: .92rem; }
.txt span { display: block; color: #999; font-size: .78rem; margin-top: 3px; word-break: break-word; }
.veredicto {
    margin: 24px 0 0; padding: 16px; border-radius: 12px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12);
    font-size: .88rem; line-height: 1.6;
}
.veredicto b { color: var(--cy); }
button {
    width: 100%; margin-top: 12px; padding: 13px;
    border: 1px solid var(--cy); border-radius: 8px;
    background: transparent; color: var(--cy);
    font-size: .85rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
}
button:active { background: rgba(0,232,255,.15); }
pre {
    margin: 16px 0 0; padding: 12px; border-radius: 8px;
    background: #0d0d0d; border: 1px solid rgba(255,255,255,.1);
    color: #9fe; font-size: .7rem; white-space: pre-wrap; word-break: break-all;
    max-height: 240px; overflow: auto;
}
</style>
</head>
<body>

<h1>Diagnóstico de medición</h1>
<p class="sub">Esperá 5 segundos a que termine.</p>

<div id="lista"></div>

<div class="veredicto" id="veredicto">Analizando…</div>

<button id="btnEvento">Disparar un evento de prueba</button>

<pre id="log">Cargando tracking.js…</pre>

<!-- Carga el mismo archivo que usa el sitio -->
<script src="https://suitsagency.lat/tracking.js"></script>

<script>
(function () {
    var lista = document.getElementById('lista');
    var log   = document.getElementById('log');
    var lineas = [];

    function apuntar(t) {
        lineas.push(t);
        log.textContent = lineas.join('\n');
    }

    function fila(estado, titulo, detalle) {
        var d = document.createElement('div');
        d.className = 'row';
        d.innerHTML = '<div class="dot ' + estado + '"></div><div class="txt"><b>' +
                      titulo + '</b><span>' + detalle + '</span></div>';
        lista.appendChild(d);
    }

    apuntar('tracking.js: ' + (typeof suitsEvento === 'function' ? 'cargado y ejecutado' : 'NO se ejecutó'));

    setTimeout(function () {
        var scriptOk = typeof suitsEvento === 'function';
        var gaOk     = typeof window.dataLayer !== 'undefined' && window.dataLayer.length > 0;
        var fbqExiste= typeof window.fbq === 'function';
        var fbqCargo = fbqExiste && window.fbq.loaded === true;
        var fbId     = fbqExiste && window.fbq.instance && window.fbq.instance.pixelsByID
                        ? Object.keys(window.fbq.instance.pixelsByID).join(', ') : '—';

        fila(scriptOk ? 'ok' : 'bad',
             'El archivo tracking.js se ejecutó',
             scriptOk ? 'Correcto' : 'No se ejecutó: hay un error de sintaxis o no se pudo descargar');

        fila(gaOk ? 'ok' : 'bad',
             'Google Analytics inicializado',
             gaOk ? window.dataLayer.length + ' entradas en dataLayer' : 'dataLayer vacío');

        fila(fbqExiste ? 'ok' : 'bad',
             'Función del píxel creada',
             fbqExiste ? 'fbq existe' : 'fbq no existe: el bloque de Meta no llegó a correr');

        fila(fbqCargo ? 'ok' : 'bad',
             'Píxel conectado con Meta',
             fbqCargo ? 'fbevents.js cargó bien' : 'fbevents.js NO cargó: bloqueado por el navegador, una extensión o la red');

        fila(fbId !== '—' ? 'ok' : 'wait',
             'ID del píxel registrado',
             fbId);

        var v = document.getElementById('veredicto');

        if (!scriptOk) {
            v.innerHTML = '<b>El script no corre.</b> Hay un error de sintaxis en tracking.js o el archivo no se descargó. Revisá que las comillas de los IDs sean rectas.';
        } else if (!fbqExiste) {
            v.innerHTML = '<b>El script corre pero no inicia el píxel.</b> Lo más probable es que el ID de Meta siga con el texto de ejemplo.';
        } else if (!fbqCargo) {
            v.innerHTML = '<b>Algo bloquea el píxel en este dispositivo.</b> El código está bien: fbevents.js no llega a cargar. Probá en otro navegador o con datos móviles en vez de wifi. Para el resto de los visitantes va a funcionar igual.';
        } else if (!gaOk) {
            v.innerHTML = '<b>Meta funciona pero Google no.</b> Revisá el ID que empieza con G-.';
        } else {
            v.innerHTML = '<b>Todo funciona.</b> Los dos están cargados y enviando datos. Si Meta te muestra cero, es demora del panel: un conjunto de datos nuevo puede tardar horas en reportar el primer evento. Usá la pestaña Test events para verlo en vivo.';
        }

        apuntar('GA4 dataLayer: ' + (gaOk ? window.dataLayer.length + ' entradas' : 'vacío'));
        apuntar('fbq existe: ' + fbqExiste);
        apuntar('fbq.loaded: ' + fbqCargo);
        apuntar('píxeles: ' + fbId);
        apuntar('navegador: ' + navigator.userAgent);
    }, 5000);

    document.getElementById('btnEvento').addEventListener('click', function () {
        if (typeof suitsEvento === 'function') {
            suitsEvento('prueba_diagnostico', 'Contact', { origen: 'diagnostico' });
            apuntar('→ Evento enviado: prueba_diagnostico / Contact');
            this.textContent = 'Evento enviado ✓  (mirá Test events en Meta)';
        } else {
            apuntar('→ No se pudo enviar: el script no está cargado');
            this.textContent = 'No se pudo enviar';
        }
    });
})();
</script>

</body>
</html>
